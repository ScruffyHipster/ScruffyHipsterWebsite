media:
  - name: assets
    label: Existing assets
    input: public/assets
    output: /assets
    rename: false
    categories: [image, document, compressed]
  - name: uploads
    label: New uploads
    input: public/assets/uploads
    output: /assets/uploads
    rename: safe
    categories: [image, document]

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "content: create {path}"
      update: "content: update {path}"
      delete: "content: delete {path}"
      rename: "content: rename {oldPath} to {newPath}"

components:
  seo:
    type: object
    label: SEO and social sharing
    fields:
      - name: title
        label: Page title
        type: string
        required: true
      - name: description
        label: Meta description
        type: text
        required: true
      - name: keywords
        label: Keywords
        type: string
        list: true
      - name: ogImage
        label: Social image
        type: image
        options:
          media: uploads
      - name: ogImageAlt
        label: Social image alt text
        type: string
      - name: robots
        label: Robots directive
        type: string

  cta:
    type: object
    label: Button
    fields:
      - name: label
        type: string
        required: true
      - name: url
        type: string
        required: true
        description: Use a trailing slash for internal links.

  link:
    type: object
    label: Link
    fields:
      - name: label
        type: string
        required: true
      - name: url
        type: string
        required: true
        description: Use a trailing slash for internal links.
      - name: style
        type: select
        options:
          values:
            - name: primary
              label: Primary button
            - name: secondary
              label: Secondary button

  image:
    type: object
    label: Image
    fields:
      - name: src
        label: Image
        type: image
        required: true
        options:
          media: uploads
      - name: alt
        label: Alt text
        type: string
        required: true
      - name: caption
        type: text

  screenshot:
    type: object
    label: Screenshot
    fields:
      - name: src
        label: Image
        type: image
        required: true
        options:
          media: assets
      - name: alt
        label: Alt text
        type: string
        required: true

  feature:
    type: object
    label: Feature
    fields:
      - name: title
        type: string
        required: true
      - name: body
        type: text
        required: true

  faq:
    type: object
    label: FAQ
    fields:
      - name: question
        type: string
        required: true
      - name: answer
        type: text
        required: true

  standard_hero:
    type: object
    label: Hero
    fields:
      - name: eyebrow
        type: string
      - name: heading
        type: string
        required: true
      - name: body
        type: text
      - name: links
        component: link
        list:
          collapsible:
            collapsed: true
            summary: "{label}"

  standard_rich_text:
    type: object
    label: Rich text
    fields:
      - name: heading
        type: string
      - name: body
        type: rich-text
        required: true
        options:
          format: html
          media: uploads

  standard_gallery:
    type: object
    label: Gallery
    fields:
      - name: heading
        type: string
      - name: images
        component: image
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{alt}"

  standard_features:
    type: object
    label: Feature list
    fields:
      - name: eyebrow
        type: string
      - name: heading
        type: string
      - name: body
        type: text
      - name: features
        component: feature
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{title}"

  standard_cta:
    type: object
    label: Call to action
    fields:
      - name: eyebrow
        type: string
      - name: heading
        type: string
        required: true
      - name: body
        type: text
      - name: links
        component: link
        list:
          collapsible:
            collapsed: true
            summary: "{label}"

  standard_faq:
    type: object
    label: FAQ list
    fields:
      - name: eyebrow
        type: string
      - name: heading
        type: string
      - name: items
        component: faq
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{question}"

content:
  - name: global
    label: Global
    type: group
    items:
      - name: site
        label: Branding, navigation and footer
        type: file
        path: content/cms/site.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: companyName
            type: string
            required: true
          - name: legalName
            type: string
            required: true
          - name: domain
            type: string
            required: true
            readonly: true
          - name: supportEmail
            type: string
            required: true
          - name: helloEmail
            type: string
            required: true
          - name: defaultOgImage
            type: image
            required: true
            options:
              media: assets
          - name: tagline
            type: string
            required: true
          - name: description
            type: text
            required: true
          - name: websiteDescription
            type: text
            required: true
          - name: branding
            type: object
            fields:
              - name: name
                type: string
                required: true
              - name: logo
                type: image
                required: true
                options:
                  media: assets
              - name: logoAlt
                type: string
                required: true
          - name: navigation
            type: object
            fields:
              - name: ariaLabel
                type: string
                required: true
              - name: items
                type: object
                list:
                  min: 1
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - name: label
                    type: string
                    required: true
                  - name: path
                    type: string
                    required: true
                    description: Base route; the site adds the canonical trailing slash.
          - name: footer
            type: object
            fields:
              - name: studioHeading
                type: string
                required: true
              - name: studioDescription
                type: text
                required: true
              - name: appsHeading
                type: string
                required: true
              - name: showcaseLabel
                type: string
                required: true
              - name: privacyHeading
                type: string
                required: true
          - name: shared
            type: object
            fields:
              - name: appCardCta
                type: string
                required: true
              - name: screenshotHeading
                type: string
                required: true
              - name: appDetail
                type: object
                fields:
                  - name: defaultPlatformLabel
                    type: string
                    required: true
                  - name: storeComingSoon
                    type: string
                    required: true
                  - name: viewOnStore
                    type: string
                    required: true
                  - name: seeFeatures
                    type: string
                    required: true
                  - name: readPrivacy
                    type: string
                    required: true
                  - name: privacyComingSoon
                    type: string
                    required: true
                  - name: featuresEyebrow
                    type: string
                    required: true
                  - name: detailEyebrow
                    type: string
                    required: true
                  - name: faqEyebrow
                    type: string
                    required: true
                  - name: faqHeading
                    type: string
                    required: true
                  - name: whyEyebrow
                    type: string
                    required: true
                  - name: whyHeading
                    type: string
                    required: true
                  - name: moreAppsEyebrow
                    type: string
                    required: true
                  - name: moreAppsHeading
                    type: string
                    required: true
              - name: privacyPolicy
                type: object
                fields:
                  - name: eyebrow
                    type: string
                    required: true
                  - name: breadcrumbLabel
                    type: string
                    required: true
                  - name: lastUpdatedLabel
                    type: string
                    required: true
              - name: rewireArticle
                type: object
                fields:
                  - name: backLabel
                    type: string
                    required: true
                  - name: titleSuffix
                    type: string
                    required: true
              - name: markdown
                type: object
                fields:
                  - name: scrollableTableAriaLabel
                    type: string
                    required: true
          - name: defaultSeo
            component: seo
          - name: socialLinks
            component: link
            list: true

  - name: fixed_pages
    label: Fixed pages
    type: group
    items:
      - name: home
        label: Homepage
        type: file
        path: content/pages/home.json
        format: json
        operations: &fixed_operations
          create: false
          rename: false
          delete: false
        fields:
          - name: published
            type: boolean
            readonly: true
          - name: route
            type: string
            readonly: true
          - name: seo
            component: seo
          - name: hero
            type: object
            fields:
              - name: eyebrow
                type: string
                required: true
              - name: paragraphs
                type: text
                list:
                  min: 1
              - name: cta
                component: cta

      - name: apps_page
        label: Apps index
        type: file
        path: content/pages/apps.json
