                required: true
              - name: unavailableCount
                type: string
                required: true
              - name: singularCount
                type: string
                required: true
              - name: pluralCount
                type: string
                required: true
          - name: hero
            type: object
            fields:
              - name: iconAlt
                type: string
                required: true
              - name: eyebrow
                type: string
                required: true
              - name: heading
                type: string
                required: true
              - name: body
                type: text
                required: true
              - name: primaryCta
