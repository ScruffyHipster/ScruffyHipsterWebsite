        label: Landing page
        type: file
        path: content/rewire/landing.json
        format: json
        operations: *fixed_operations
        fields:
          - name: published
            type: boolean
            readonly: true
          - name: route
            type: string
            readonly: true
          - name: seo
            component: seo
          - name: softwareApplication
            type: object
            fields:
              - name: name
                type: string
                required: true
              - name: applicationCategory
                type: string
                required: true
              - name: applicationSubCategory
                type: string
                required: true
              - name: description
                type: text
                required: true
              - name: featureList
                type: string
                list:
                  min: 1
              - name: offer
                type: object
                fields:
                  - name: price
                    type: string
                    required: true
                  - name: priceCurrency
                    type: string
                    required: true
          - name: ratingLabels
            type: object
            fields:
