                required: true
              - name: body
                type: text
                required: true
              - name: cta
                type: string
                required: true
          - name: screenshotsSection
            type: object
            fields:
              - name: eyebrow
                type: string
                required: true
              - name: heading
                type: string
                required: true
              - name: body
                type: text
                required: true
          - name: howItWorks
            type: object
            fields:
              - name: eyebrow
                type: string
                required: true
              - name: heading
                type: string
                required: true
          - name: proof
            type: object
            fields:
              - name: eyebrow
                type: string
                required: true
              - name: heading
                type: string
                required: true
              - name: items
                type: string
                list:
                  min: 1
          - name: guidesSection
            type: object
            fields:
              - name: eyebrow
                type: string
                required: true
              - name: heading
                type: string
                required: true
          - name: faqSection
            type: object
            fields:
              - name: eyebrow
                type: string
                required: true
              - name: heading
                type: string
                required: true
              - name: linkLabel
                type: string
                required: true
          - name: finalCta
            type: object
            fields:
              - name: eyebrow
                type: string
                required: true
              - name: heading
                type: string
                required: true
              - name: primaryLabel
                type: string
                required: true
              - name: secondaryLabel
                type: string
                required: true
          - name: linkFooter
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{heading}"
            fields:
              - name: heading
                type: string
                required: true
              - name: links
                component: cta
                list:
                  min: 1
                  collapsible:
                    collapsed: true
                    summary: "{label}"
          - name: appStoreFacts
            type: object
            fields:
              - name: appStoreUrl
                type: string
                required: true
              - name: appId
                type: string
                required: true
              - name: bundleId
                type: string
                required: true
              - name: title
                type: string
                required: true
              - name: subtitle
                type: string
              - name: developer
                type: string
              - name: categories
                type: string
                list: true
              - name: price
                type: string
                required: true
              - name: hasInAppPurchases
                type: boolean
              - name: version
                type: string
              - name: releaseDate
                type: date
              - name: currentVersionReleaseDate
                type: date
              - name: rating
                type: number
              - name: ratingCount
                type: number
              - name: minimumOsVersion
                type: string
                required: true
              - name: contentRating
                type: string
              - name: privacyPolicyUrl
                type: string
              - name: appStorePrivacyPolicyUrl
                type: string
              - name: eulaUrl
                type: string
                required: true
              - name: releaseNotes
                type: text
              - name: assetBasePath
                type: string
          - name: screenshots
            component: screenshot
            list:
              min: 1
              collapsible:
                collapsed: true
                summary: "{alt}"
          - name: showcaseSections
            type: object
            list:
              min: 1
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: eyebrow
                type: string
                required: true
              - name: title
                type: string
                required: true
              - name: body
                type: text
                required: true
              - name: image
                component: screenshot
          - name: guidePages
            type: object
            list:
              min: 1
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: slug
                type: string
                required: true
              - name: title
                type: string
                required: true
              - name: description
                type: text
                required: true
              - name: keyword
                type: string
                required: true
          - name: faqs
            type: object
            list:
              min: 1
              collapsible:
                collapsed: true
                summary: "{question}"
            fields:
              - name: question
                type: string
                required: true
              - name: answer
                type: text
                required: true
              - name: guideSlug
                type: string
                required: true

      - name: rewire_articles
        label: Articles
        type: collection
        path: content/rewire-blog
        format: yaml-frontmatter
        filename: &article_filename
          template: "{primary}.md"
          field: create
        operations: &article_operations
          create: true
          rename: false
          delete: false
        view:
          fields: [title, published, publishedAt]
          primary: title
          sort: [publishedAt, title]
          search: [title, description, tags]
          default:
            sort: publishedAt
            order: desc
        fields: &article_fields
          - name: title
            type: string
            required: true
