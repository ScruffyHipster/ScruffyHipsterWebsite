        filename: *article_filename
        operations: *article_operations
        view:
          fields: [title, published, publishedAt]
          primary: title
          sort: [publishedAt, title]
          search: [title, description, tags]
          default:
            sort: publishedAt
            order: desc
        fields: *article_fields

  - name: standard_pages
    label: Standard pages
    type: collection
    path: content/standard-pages
    format: json
    exclude: [README.md]
    filename:
      template: "{fields.slug}.json"
      field: false
    operations:
      create: true
      rename: false
      delete: false
    view:
      fields: [title, slug, published]
      primary: title
      sort: [title]
      search: [title, slug]
    fields:
      - name: slug
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: Use lowercase letters, numbers, and hyphens only.
        description: Must match the filename. It cannot change after creation.
      - name: published
        type: boolean
        required: true
      - name: title
        type: string
        required: true
      - name: seo
        component: seo
      - name: sections
        type: block
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{type}"
        blockKey: type
        blocks:
          - name: hero
            component: standard_hero
          - name: richText
            component: standard_rich_text
          - name: image
            component: image
          - name: gallery
            component: standard_gallery
          - name: featureList
            component: standard_features
          - name: cta
            component: standard_cta
          - name: faq
            component: standard_faq
