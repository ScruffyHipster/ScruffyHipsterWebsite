        fields:
          - name: published
            type: boolean
            readonly: true
          - name: route
            type: string
            readonly: true
          - name: seo
            component: seo
          - name: eyebrow
            type: string
            required: true
          - name: heading
            type: string
            required: true
          - name: body
            type: text
            required: true
          - name: primaryCta
            component: cta
          - name: secondaryCta
            component: cta

      - name: rewire_blog_index
        label: Rewire blog index
        type: file
        path: content/pages/rewire-blog.json
        format: json
        operations: *fixed_operations
        fields:
          - name: published
            type: boolean
            readonly: true
          - name: route
            type: string
            readonly: true
          - name: seo
            component: seo
          - name: hero
            type: object
            fields:
              - name: eyebrow
                type: string
                required: true
              - name: heading
                type: string
                required: true
              - name: body
                type: text
                required: true
          - name: breadcrumbs
            type: object
            fields:
              - name: rewire
                type: string
                required: true
              - name: blog
                type: string
                required: true
          - name: emptyLabel
            type: string
            required: true

      - name: breastfeeding_guides_index
        label: Breastfeeding guide index
        type: file
        path: content/pages/breastfeeding-guides.json
        format: json
        operations: *fixed_operations
        fields:
          - name: published
            type: boolean
            readonly: true
          - name: route
            type: string
            readonly: true
          - name: seo
            component: seo
          - name: collection
            type: object
            fields:
              - name: name
                type: string
                required: true
              - name: description
                type: text
                required: true
          - name: breadcrumbs
            type: object
            fields:
              - name: tracker
                type: string
                required: true
              - name: guides
                type: string
                required: true
          - name: hero
            type: object
            fields:
              - name: backLabel
                type: string
                required: true
              - name: eyebrow
                type: string
                required: true
              - name: heading
                type: string
                required: true
              - name: body
                type: text
                required: true

  - name: apps
    label: Apps
    type: collection
    path: content/apps
    format: json
    filename:
      template: "{fields.slug}.json"
      field: false
    operations:
      create: false
      rename: false
      delete: false
    view:
      fields: [name, published, slug]
      primary: name
      sort: [order, name]
    fields:
      - name: id
        type: string
        required: true
        readonly: true
      - name: order
        type: number
        required: true
      - name: slug
        type: string
        required: true
        readonly: true
      - name: published
        type: boolean
        required: true
      - name: name
        type: string
        required: true
      - name: platformLabel
        type: string
      - name: operatingSystem
        type: string
      - name: applicationCategory
        type: string
      - name: heroTitle
        type: string
        required: true
      - name: tagline
        type: text
        required: true
      - name: shortDescription
        type: text
        required: true
      - name: longDescription
        type: text
        required: true
      - name: appStoreUrl
        type: string
        required: true
      - name: pressKit
        type: object
        fields:
          - name: url
            type: file
            options:
              media: assets
          - name: label
            type: string
          - name: description
            type: text
      - name: icon
        type: image
        required: true
        options:
          media: assets
      - name: iconAlt
        type: string
        required: true
      - name: screenshots
        component: screenshot
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{alt}"
      - name: featureHeading
        type: string
        required: true
      - name: featureIntro
        type: text
        required: true
      - name: features
        component: feature
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{title}"
      - name: seoApplicationSubCategory
        type: string
      - name: seoFeatureList
        type: string
        list: true
      - name: structuredData
        type: object
        fields:
          - name: description
            type: text
            required: true
          - name: applicationSubCategory
            type: string
          - name: featureList
            type: string
            list: true
      - name: seoContent
        type: object
        fields:
          - name: eyebrow
            type: string
          - name: heading
            type: string
            required: true
          - name: paragraphs
            type: text
            list: true
      - name: faqHeading
        type: string
      - name: faqIntro
        type: text
      - name: faqs
        component: faq
        list:
          collapsible:
            collapsed: true
            summary: "{question}"
      - name: privacySummary
        type: text
        required: true
      - name: privacySlug
        type: string
      - name: yearLabel
        type: string
        required: true
      - name: seo
        component: seo
      - name: accent
        type: object
        fields:
          - name: from
            type: string
            required: true
          - name: via
            type: string
            required: true
          - name: to
            type: string
            required: true

  - name: privacy_policies
    label: Privacy policies
    type: collection
    path: content/privacy-policies
    format: json
    filename:
      template: "{fields.slug}.json"
      field: false
    operations:
      create: false
      rename: false
      delete: false
    view:
      fields: [appName, published, lastUpdated]
      primary: appName
      sort: [order, appName]
    fields:
      - name: slug
        type: string
        required: true
        readonly: true
      - name: order
        type: number
        required: true
      - name: published
        type: boolean
        required: true
      - name: appName
        type: string
        required: true
      - name: title
        type: string
        required: true
      - name: lastUpdated
        type: string
        required: true
      - name: htmlContent
        label: Policy body
        type: rich-text
        required: true
        options:
          format: html
          media: uploads
      - name: seo
        component: seo

  - name: rewire
    label: Rewire
    type: group
    items:
